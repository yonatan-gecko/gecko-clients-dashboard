<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Performance Dashboards</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Using modern, premium fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Extracted External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<!-- Optional: Add class="theme-light" or class="theme-dark" to the body tag to override system preferences -->

<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">Gecko Digital</div>
            <h1 class="page-title">Client Performance Dashboard</h1>
            <div class="header-controls">
                <div class="live-datetime" id="live-datetime">
                    <span id="date-display"></span> • <span id="time-display"></span>
                </div>
                <div class="theme-toggle-wrapper">
                    <span class="theme-label-text">Dark Mode</span>
                    <input type="checkbox" id="theme-switch" class="theme-checkbox">
                    <label for="theme-switch" class="theme-toggle" aria-label="Toggle Dark Mode"></label>
                </div>
            </div>
        </div>
    </header>

    <div class="layout-wrapper">
        <aside class="sidebar">
            <h3 class="sidebar-title">Clients</h3>
            <nav class="sidebar-nav" id="client-nav">
                <!-- Navigation links will be dynamically injected here -->
            </nav>
        </aside>

        <main class="main-content" id="dashboard-container">
            <!-- Client reports will be dynamically injected here by Javascript -->
        </main>
    </div>

    <!-- Script to dynamically load HTML fragments from the /reports directory -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('dashboard-container');
            const navContainer = document.getElementById('client-nav');

            const reports = [
                "Udi Bar.html",
                "Elements by Tal Man.html",
                "Yael Admoni.html",
                "Nola American Bakery.html",
                "Maimon Website.html"
            ];

            const clientData = {
                "Udi Bar": {
                    dashboard: { url: "https://docs.google.com/spreadsheets/d/1-skleP69NQTgNPHUnE778q1jDx31P5Dt0k1jp2LWDrM/edit?gid=1482883680#gid=1482883680", label: "Dashboard" },
                    drive: { url: "https://drive.google.com/drive/folders/1YkIjTRNsNaGCIaIVN7UawWGT206_6PqW", label: "Drive Folder" },
                    social: { url: "https://www.instagram.com/drudibarr/", label: "Instagram" },
                    ads: { url: "https://ads.google.com/aw/campaigns?ocid=7164301110&ascid=7164301110&euid=1482534637&__u=9730191813&uscid=357780932&__c=5724271268&authuser=0", label: "Google Ads" },
                    website: { url: "https://www.dr-barr.com/he/", label: "dr-barr.com" },
                    backend: { url: "https://www.dr-barr.com/wp-admin/", label: "WordPress Admin" }
                },
                "Elements by Tal Man": {
                    dashboard: { url: "https://docs.google.com/spreadsheets/d/1TNBCAVmdJxDBm4QsZdQo9SODA9RizKY7kq8Z5I5bbHk/edit?gid=0#gid=0", label: "Dashboard" },
                    drive: { url: "https://drive.google.com/drive/folders/1ceUug1XnTWaQ9TwISRkLj3Z6yP3Ih077", label: "Drive Folder" },
                    social: { url: "https://www.instagram.com/elements_by_tal_man/", label: "Instagram" },
                    ads: { url: "https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=481050401067838&business_id=148648279319173&global_scope_id=148648279319173&attribution_windows=default&column_preset=10163858906964197&date=2026-01-26_2026-01-27%2Cyesterday&insights_date=2026-01-26_2026-01-27%2Cyesterday&filter_set=campaign.impressions-NUMBER%1EGREATER_THAN%1E0&quick_view_id=10163842464614197", label: "Meta Ads" },
                    website: { url: "https://talman.co.il/", label: "talman.co.il" },
                    backend: { url: "https://admin.shopify.com/store/7d07e9-f1/analytics/reports/total_sales_over_time", label: "Shopify Backend" }
                },
                "Yael Admoni": {
                    dashboard: { url: "https://docs.google.com/spreadsheets/d/1gAkO6aeVrDWiVm0N1qMP4eyM9Kggww3wF_WoVTdNC_o/edit?gid=43574259#gid=43574259", label: "Dashboard" },
                    drive: { url: "https://drive.google.com/drive/folders/18Fwu7ha98bY3zP6YQ5fcDgSksvz_TgFP", label: "Drive Folder" },
                    social: { url: "https://www.instagram.com/yaeladmoni/", label: "Instagram" },
                    ads: { url: "https://ads.google.com/aw/campaigns?ocid=6465756846&ascid=6465756846&euid=1482534637&__u=9730191813&uscid=357780932&__c=5724271268&authuser=0", label: "Google Ads" },
                    website: { url: "https://yaeladmoni.com/?srsltid=AfmBOorkXGvaOq_9-lzbIT2-v34QHtICKBCYfoSn00MnWvfHCfhpggAq", label: "yaeladmoni.com" },
                    backend: { url: "https://admin.shopify.com/store/yaeladmoni", label: "Shopify Backend" }
                },
                "Nola American Bakery": {
                    dashboard: { url: "https://docs.google.com/spreadsheets/d/1g7kdgLGWD2lTmAmb7o_ow5AfdIgD4vBNb_KvHnWJKWY/edit?gid=1525165723#gid=1525165723", label: "Dashboard" },
                    drive: { url: "https://drive.google.com/drive/folders/1mc6It149YzIw5Cbkr44LEHOU9-AuJLoD", label: "Drive Folder" },
                    social: { url: "https://www.instagram.com/nola_american_bakery/?hl=en", label: "Instagram" },
                    ads: { url: "https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=355196194&business_id=174834508571284&global_scope_id=174834508571284", label: "Meta Ads" },
                    website: { url: "https://www.nola-b.co.il/", label: "nola-b.co.il" },
                    backend: { url: "#", label: "Website Backend" }
                },
                "Maimon Website": {
                    dashboard: { url: "https://docs.google.com/spreadsheets/d/1mcda2NmPF77AoA9sTaeq7lQQVeLZng7dNi4s4WeCrJQ/edit?gid=0#gid=0", label: "Dashboard" },
                    drive: { url: "https://drive.google.com/drive/folders/1oaD2tQRN2jN3H8bOc8bCet0nkMk5deQt", label: "Drive Folder" },
                    social: { url: "https://www.instagram.com/maimons_baking_?igsh=OGg2OHJwcWZic2Zx", label: "Instagram" },
                    ads: { url: "https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=841333458850837&business_id=609463445121469&global_scope_id=609463445121469", label: "Meta Ads" },
                    website: { url: "https://maimongroup.co.il/", label: "maimongroup.co.il" },
                    backend: { url: "#", label: "Website Backend" }
                }
            };

            const getTitle = (info) => {
                if (!info || !info.url || info.url === "#") return info ? info.label : "Not available";
                return info.url.length > 40 ? info.label : info.url;
            };

            const renderIcon = (info, defaultSvg) => {
                if (!info || !info.url || info.url === "#") return defaultSvg;
                try {
                    const hostname = new URL(info.url).hostname;
                    return `<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=64" alt="${info.label}" width="18" height="18" style="object-fit: contain; border-radius: 2px;">`;
                } catch {
                    return defaultSvg;
                }
            };

            for (const reportFile of reports) {
                try {
                    // Explicitly URL encode the filename to safely handle spaces
                    // Also use cache: no-store so the browser never gets stuck on old iframe sizes when you edit the files
                    const response = await fetch(`./reports/${encodeURIComponent(reportFile)}`, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`Could not load ${reportFile}`);

                    const embedHtml = await response.text();

                    // Parse the client name from the filename (remove .html)
                    const clientName = reportFile.replace(/\.[^/.]+$/, "");

                    const clientInfo = clientData[clientName] || {
                        dashboard: { url: "#", label: "Dashboard" },
                        drive: { url: "#", label: "Drive Folder" },
                        social: { url: "#", label: "Social Pages" },
                        ads: { url: "#", label: "Ad Platform" },
                        website: { url: "#", label: "Website" },
                        backend: { url: "#", label: "Website Backend" }
                    };

                    // Dynamically extract width and height from the raw HTML embed code
                    // to mathematically calculate the perfect aspect ratio for any embed!
                    const widthMatch = embedHtml.match(/width="(\d+)"/);
                    const heightMatch = embedHtml.match(/height="(\d+)"/);

                    // Default fallback height if dimensions aren't explicitly provided
                    let heightOverride = "600px";
                    if (heightMatch) {
                        heightOverride = `${heightMatch[1]}px`;
                    }

                    // Create a safe ID for linking
                    const sectionId = 'client-' + clientName.toLowerCase().replace(/[^a-z0-9]+/g, '-');

                    // Extract the raw image string from renderIcon to use in nav link, empty string as fallback
                    const menuIcon = renderIcon(clientInfo.website, "");
                    const menuIconWithClass = menuIcon ? menuIcon.replace('<img', '<img class="nav-icon"') : "";

                    // Create navigation link
                    const navLinkHTML = `<a href="#${sectionId}" class="nav-link">${menuIconWithClass} <span class="nav-text">${clientName}</span></a>`;
                    navContainer.insertAdjacentHTML('beforeend', navLinkHTML);

                    // Build the client section mapping using an inline style override for the height
                    const sectionHTML = `
                        <section id="${sectionId}" class="client-card">
                            <div class="client-header">
                                <h2 class="client-name">${clientName}</h2>
                                <div class="client-links">
                                    <a href="${clientInfo.dashboard.url}" class="client-link" title="${getTitle(clientInfo.dashboard)}" target="_blank" aria-label="Dashboard">
                                        ${renderIcon(clientInfo.dashboard, `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-dashboard"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>`)}
                                    </a>
                                    <a href="${clientInfo.drive.url}" class="client-link" title="${getTitle(clientInfo.drive)}" target="_blank" aria-label="Drive Folder">
                                        ${renderIcon(clientInfo.drive, `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>`)}
                                    </a>
                                    <a href="${clientInfo.social.url}" class="client-link" title="${getTitle(clientInfo.social)}" target="_blank" aria-label="Social Pages">
                                        ${renderIcon(clientInfo.social, `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-instagram"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>`)}
                                    </a>
                                    <a href="${clientInfo.ads.url}" class="client-link" title="${getTitle(clientInfo.ads)}" target="_blank" aria-label="Ad Platform">
                                        ${renderIcon(clientInfo.ads, `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-megaphone"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>`)}
                                    </a>
                                    <a href="${clientInfo.website.url}" class="client-link" title="${getTitle(clientInfo.website)}" target="_blank" aria-label="Website">
                                        ${renderIcon(clientInfo.website, `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>`)}
                                    </a>
                                    <a href="${clientInfo.backend.url}" class="client-link" title="${getTitle(clientInfo.backend)}" target="_blank" aria-label="Website Backend">
                                        ${renderIcon(clientInfo.backend, `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-server"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>`)}
                                    </a>
                                </div>
                            </div>
                            <div class="iframe-container" style="height: ${heightOverride};">
                                ${embedHtml}
                            </div>
                        </section>
                    `;

                    // Append to the DOM
                    container.insertAdjacentHTML('beforeend', sectionHTML);

                } catch (error) {
                    console.error("Error loading report:", error);
                }
            }
        });

        // Live Date & Time Script
        function updateDateTime() {
            const dateDisplay = document.getElementById('date-display');
            const timeDisplay = document.getElementById('time-display');

            const now = new Date();

            // Format Date: e.g., "Mon, Mar 8"
            const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
            dateDisplay.textContent = now.toLocaleDateString('en-US', dateOptions);

            // Format Time: e.g., "12:37 AM"
            const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
            timeDisplay.textContent = now.toLocaleTimeString('en-US', timeOptions);
        }

        // Run immediately and update every minute
        updateDateTime();
        setInterval(updateDateTime, 60000);

        // Scroll Spy / Active Navigation Highlighting
        // Using IntersectionObserver for high-performance scroll detection
        const navObserverOptions = {
            root: null,
            rootMargin: '-20% 0px -79% 0px', // Triggers when element is at top 20% of viewport
            threshold: 0
        };

        const navObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Remove active class from all links
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.remove('active');
                    });

                    // Add active class to corresponding link
                    const activeId = entry.target.getAttribute('id');
                    const activeLink = document.querySelector(`.nav-link[href="#${activeId}"]`);
                    if (activeLink) {
                        activeLink.classList.add('active');

                        // Scroll sidebar to ensure active link is visible
                        activeLink.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            });
        }, navObserverOptions);

        // We need to wait a tiny bit for the dynamic HTML injection to finish before observing them
        setTimeout(() => {
            document.querySelectorAll('.client-card').forEach(section => {
                navObserver.observe(section);
            });

            // Set first item active manually on load just in case the observer hasn't fired yet
            const firstLink = document.querySelector('.nav-link');
            if (firstLink && window.scrollY === 0) {
                firstLink.classList.add('active');
            }
        }, 1000);

    </script>
</body>

</html>
